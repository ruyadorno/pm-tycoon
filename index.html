<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2f9bd6" />
    <meta name="apple-mobile-web-app-title" content="PM Tycoon" />
    <title>Package Management Tycoon</title>
    <!-- The L5 HQ in the city (tools/art/webicons.ts, public/): Vite rewrites
         these root paths to page-relative ones, so they work under a subpath. -->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      /* phaser4-notes.md §4: no rubber-band, no double-tap zoom, no page
         pinch-zoom over the canvas; the portrait column of decision #4. */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #2f9bd6;
        touch-action: none;
        -webkit-text-size-adjust: 100%;
      }
      #game {
        width: min(100vw, 430px);
        /* 100vh first: Safari before 15.4 has no dvh units. */
        height: 100vh;
        height: 100dvh;
        margin: 0 auto;
        padding: 0;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game canvas {
        display: block;
        touch-action: none;
        image-rendering: pixelated;
      }
      /* Safe-area probe, read by src/main.ts (city-view.md §1.1). */
      #safe {
        position: fixed;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
        visibility: hidden;
        pointer-events: none;
      }
      /* Plain HTML cards for the WebGL gate and fatal boot errors. */
      .pm-card {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #2f9bd6;
        color: #fcf9f1;
        font:
          16px/1.4 ui-monospace,
          Menlo,
          Consolas,
          monospace;
        text-align: center;
      }
      .pm-card > div {
        max-width: 360px;
        background: #4e4858;
        border: 2px solid #241e32;
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <div id="safe"></div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
