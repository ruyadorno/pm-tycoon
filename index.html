<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#2f9bd6" />
    <title>Package Management Tycoon</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%232f9bd6'/%3E%3Crect x='3' y='4' width='10' height='9' fill='%23c08a58'/%3E%3Crect x='3' y='4' width='10' height='2' fill='%23e2bb8a'/%3E%3Crect x='7' y='4' width='2' height='9' fill='%23f8d13e'/%3E%3C/svg%3E"
    />
    <style>
      /* phaser4-notes.md §4: no rubber-band, no double-tap zoom, no page
         pinch-zoom over the canvas; the portrait column of decision #4. */
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #2f9bd6;
        touch-action: none;
        -webkit-text-size-adjust: 100%;
      }
      #game {
        width: min(100vw, 430px);
        height: 100dvh;
        margin: 0 auto;
        padding: 0;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
      }
      #game canvas {
        display: block;
        touch-action: none;
        image-rendering: pixelated;
      }
      /* Safe-area probe, read by src/main.ts (city-view.md §1.1). */
      #safe {
        position: fixed;
        top: 0;
        left: 0;
        width: 0;
        height: 0;
        padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom) 0;
        visibility: hidden;
        pointer-events: none;
      }
      /* Plain HTML cards for the WebGL gate and fatal boot errors. */
      .pm-card {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #2f9bd6;
        color: #fcf9f1;
        font:
          16px/1.4 ui-monospace,
          Menlo,
          Consolas,
          monospace;
        text-align: center;
      }
      .pm-card > div {
        max-width: 360px;
        background: #4e4858;
        border: 2px solid #241e32;
        padding: 16px;
      }
    </style>
  </head>
  <body>
    <div id="safe"></div>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
